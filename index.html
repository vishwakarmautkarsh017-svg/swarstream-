<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#10b981" />
  <title>SwarStream Ultimate</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151922;
      --card-hover: #1e2430;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.28);
      --blue: #38bdf8;
      --pink: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 14px 12px 175px; }
    .app-container { width: 100%; max-width: 700px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--blue)); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #0b0e14; }
    .brand h1 { font-size: 18px; font-weight: 700; }
    .brand p { font-size: 11px; color: var(--muted); }
    .status-badge { font-size: 11px; padding: 5px 10px; border-radius: 999px; font-weight: 600; display: flex; align-items: center; gap: 5px; background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-badge.offline { background: rgba(244, 63, 94, 0.15); color: #fb7185; border-color: rgba(244, 63, 94, 0.35); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-input { width: 100%; background: var(--card); border: 1px solid rgba(255, 255, 255, 0.09); color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 13px; outline: none; }
    .search-input:focus { border-color: var(--accent); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .tabs { display: flex; background: var(--card); padding: 4px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.06); gap: 2px; }
    .tab-btn { background: transparent; color: var(--muted); border: none; padding: 6px 11px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: #090d12; }
    .visualizer-box { position: relative; height: 110px; background: linear-gradient(180deg, #131822, #0d1118); border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.07); margin-bottom: 14px; overflow: hidden; }
    canvas#visualizer { width: 100%; height: 100%; display: block; }
    .now-playing-overlay { position: absolute; left: 14px; top: 10px; right: 14px; pointer-events: none; }
    .now-playing-overlay span { font-size: 10px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
    .now-playing-overlay h2 { font-size: 15px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lyric-line { margin-top: 8px; font-size: 13px; color: #fde047; font-weight: 600; }
    .song-list { display: flex; flex-direction: column; gap: 8px; }
    .song-item { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; gap: 8px; }
    .song-item.active { border-color: var(--accent); background: rgba(16, 185, 129, 0.09); }
    .song-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .cover { width: 40px; height: 40px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; color: #fff; }
    .song-info { min-width: 0; }
    .song-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 19, 28, 0.96); backdrop-filter: blur(14px); border-top: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 14px 14px; display: flex; flex-direction: column; align-items: center; z-index: 50; }
    .player-inner { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 7px; }
    .progress-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
    input[type="range"].seek-bar { flex: 1; accent-color: var(--accent); height: 4px; cursor: pointer; }
    .controls-row { display: flex; align-items: center; justify-content: space-between; }
    .main-controls { display: flex; align-items: center; gap: 12px; }
    .ctrl-btn { background: none; border: none; color: var(--text); font-size: 17px; cursor: pointer; opacity: 0.85; }
    .play-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #090d12; font-size: 17px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .empty-msg { text-align: center; padding: 30px; color: var(--muted); font-size: 13px; background: var(--card); border-radius: 12px; }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand">
        <div class="brand-icon">♪</div>
        <div>
          <h1>SwarStream Ultimate</h1>
          <p>Online + Offline • Screen-Off Play</p>
        </div>
      </div>
      <div class="status-badge" id="netBadge">
        <span class="dot"></span>
        <span id="netText">Online</span>
      </div>
    </header>

    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="Gaana search karein..." />
    </div>

    <div class="toolbar">
      <div class="tabs">
        <button class="tab-btn active" id="tabAll">All Songs</button>
      </div>
    </div>

    <div class="visualizer-box">
      <div class="now-playing-overlay">
        <span id="playModeLabel">READY</span>
        <h2 id="currentTitle">Koi bhi gaana chunein...</h2>
        <div class="lyric-line" id="lyricDisplay">♪ Lyrics yahan chalenge...</div>
      </div>
      <canvas id="visualizer"></canvas>
    </div>

    <div class="song-list" id="songList"></div>
  </div>

  <div class="player-bar">
    <div class="player-inner">
      <div class="progress-row">
        <span id="curTime">0:00</span>
        <input type="range" class="seek-bar" id="seekBar" min="0" max="100" value="0" />
        <span id="durTime">0:00</span>
      </div>
      <div class="controls-row">
        <div style="font-size:11px; color:var(--muted);" id="artistLabel">SwarStream</div>
        <div class="main-controls">
          <button class="ctrl-btn" id="prevBtn">⏮</button>
          <button class="ctrl-btn play-btn" id="playPauseBtn">▶</button>
          <button class="ctrl-btn" id="nextBtn">⏭</button>
        </div>
        <div></div>
      </div>
    </div>
  </div>

  <script>
    const songs = [
      { id: '1', title: 'Midnight Lo-Fi Beats', artist: 'Aarav Synth', color: 'linear-gradient(135deg, #6366f1, #a855f7)', notes: [261, 329, 392], tempo: 115, lyrics: ['♪ Raat ki khamoshi...', '♪ Lo-Fi beats...'] },
      { id: '2', title: 'Monsoon Acoustic Vibes', artist: 'Kavya & Strings', color: 'linear-gradient(135deg, #10b981, #059669)', notes: [220, 261, 329], tempo: 100, lyrics: ['♪ Baarish ki boondein...', '♪ Suhana safar...'] },
      { id: '3', title: 'Neon Highway Sub-Bass', artist: 'DJ Pulse', color: 'linear-gradient(135deg, #f43f5e, #fb923c)', notes: [293, 349, 440], tempo: 132, lyrics: ['♪ Tez raftaar neon...', '♪ Bass drop...'] }
    ];

    function generateBlob(song) {
      const sr = 22050, secs = 10, samples = sr * secs;
      const buf = new ArrayBuffer(44 + samples * 2), view = new DataView(buf);
      const writeStr = (off, s) => { for(let i=0; i<s.length; i++) view.setUint8(off+i, s.charCodeAt(i)); };
      writeStr(0, 'RIFF'); view.setUint32(4, 36 + samples * 2, true); writeStr(8, 'WAVE');
      writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
      view.setUint16(22, 1, true); view.setUint32(24, sr, true); view.setUint32(28, sr * 2, true);
      view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeStr(36, 'data');
      view.setUint32(40, samples * 2, true);

      const step = 60 / song.tempo / 2;
      for (let i = 0; i < samples; i++) {
        const t = i / sr, sIdx = Math.floor(t / step), f = song.notes[sIdx % song.notes.length];
        const env = Math.exp(-(t % step) * 4), val = Math.sin(2 * Math.PI * f * t) * 0.4 * env;
        view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, val)) * 32767, true);
      }
      return new Blob([buf], { type: 'audio/wav' });
    }

    const audio = new Audio();
    let curIdx = -1, audioCtx = null, analyser = null, dataArray = null;

    function setupAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      src.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    const canvas = document.getElementById('visualizer'), ctx = canvas.getContext('2d');
    function drawVis() {
      canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (analyser && !audio.paused) {
        analyser.getByteFrequencyData(dataArray);
        for (let i = 0; i < 24; i++) {
          const h = Math.max(4, ((dataArray[i] || 8) / 255) * canvas.height * 0.7);
          ctx.fillStyle = i % 2 === 0 ? '#10b981' : '#38bdf8';
          ctx.fillRect(i * 12 + 10, canvas.height - h, 8, h);
        }
      }
      requestAnimationFrame(drawVis);
    }
    requestAnimationFrame(drawVis);

    function renderList() {
      const list = document.getElementById('songList'), q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = songs.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q));
      list.innerHTML = filtered.length === 0 ? '<div class="empty-msg">Koi gaana nahi mila.</div>' : '';
      filtered.forEach(song => {
        const isCur = songs[curIdx]?.id === song.id;
        const row = document.createElement('div');
        row.className = `song-item ${isCur ? 'active' : ''}`;
        row.innerHTML = `
          <div class="song-left">
            <div class="cover" style="background:${song.color}">${isCur && !audio.paused ? '❚❚' : '▶'}</div>
            <div class="song-info">
              <div class="song-title">${song.title}</div>
              <div class="song-meta">${song.artist}</div>
            </div>
          </div>`;
        row.onclick = () => playSong(song.id);
        list.appendChild(row);
      });
    }

    function playSong(id) {
      setupAudio();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      const idx = songs.findIndex(s => s.id === id);
      if (idx === -1) return;
      curIdx = idx;
      const song = songs[idx];
      audio.src = URL.createObjectURL(generateBlob(song));
      audio.play();
      document.getElementById('currentTitle').textContent = `${song.title} — ${song.artist}`;
      document.getElementById('playPauseBtn').textContent = '❚❚';
      renderList();
    }

    document.getElementById('playPauseBtn').onclick = () => {
      if (curIdx === -1) playSong(songs[0].id);
      else if (audio.paused) { audio.play(); document.getElementById('playPauseBtn').textContent = '❚❚'; }
      else { audio.pause(); document.getElementById('playPauseBtn').textContent = '▶'; }
      renderList();
    };

    document.getElementById('prevBtn').onclick = () => { if(songs.length) playSong(songs[(curIdx - 1 + songs.length) % songs.length].id); };
    document.getElementById('nextBtn').onclick = () => { if(songs.length) playSong(songs[(curIdx + 1) % songs.length].id); };
    document.getElementById('searchInput').oninput = renderList;

    audio.ontimeupdate = () => {
      document.getElementById('curTime').textContent = Math.floor(audio.currentTime) + 's';
      document.getElementById('durTime').textContent = Math.floor(audio.duration || 0) + 's';
      if (audio.duration) document.getElementById('seekBar').value = (audio.currentTime / audio.duration) * 100;
    };
    document.getElementById('seekBar').oninput = (e) => { if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration; };

    renderList();
  </script>
</body>
</html>
